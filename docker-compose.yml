services:

  # ── Magento Application (PHP 8.2 + Nginx + Supervisor) ──────────────────────
  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:80"
      - "8443:443"
    env_file: .env
    environment:
      MAGENTO_DATABASE_HOST: db
      MAGENTO_DATABASE_PORT_NUMBER: "3306"
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT_NUMBER: "9200"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── MariaDB 10.6 ─────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE:      "${MAGENTO_DATABASE_NAME:-magento}"
      MYSQL_USER:          "${MAGENTO_DATABASE_USER:-magento}"
      MYSQL_PASSWORD:      "${MAGENTO_DATABASE_PASSWORD:-magento}"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ── Elasticsearch 7.17 ───────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:7.17.18
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── Mailpit (e-mail dev trap) ─────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    restart: unless-stopped

  # ── phpMyAdmin ───────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis Commander ───────────────────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  db_data:
  es_data:
